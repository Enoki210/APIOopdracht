<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Pokedex Zoeker</title>
    <link rel="stylesheet" href="BasisCSS.css">
</head>

<body>

<div class="container">
    <div class="box-Name">Name</div>
    <div class="box-ID">ID</div>
    <div class="box-Weight">Weight</div>
    <div class="box-Length">Length</div>
    <div class="box-Type">Type</div>
    <div class="box-Shiny">Shiny</div>
    <div class="box-Stats">Stats</div>
    <div class="box-Abilities">Abilities</div>
</div>

<div class="naambox">
    <div class="picdoos">
        <img src="" alt="Pokémon Sprite" id="pokemonSprite" style="display: none;">
    </div>
    <div class="zoekdoos">
        <div class="error"></div>
        <div class="zoekbalk">
            <label for="pokemonName"></label>
            <input class="input" type="text" id="pokemonName" placeholder="Plaats Pokémon Naam">
            <button class="button" onclick="fetchData()">Zoek Pokémon</button>
        </div>
    </div>
</div>

<div id="toggle" class="toggle">s<br>h<br>i<br>n<br>y</div>

<div class="info">
</div>


<script src="BasisJava.js"></script>
</body>
</html>
